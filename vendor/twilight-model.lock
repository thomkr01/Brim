# The crates.io release vendor/twilight-model is built from (checksum from the crates.io index).
# scripts/check-vendor.sh fails when vendor/twilight-model is not this release plus
# vendor/twilight-model.patch, and CI runs `cargo audit -f` on this file: cargo audit skips the
# patched path copy in Cargo.lock, so this is what keeps it under advisory checks.
version = 4

[[package]]
name = "twilight-model"
version = "0.18.0"
source = "registry+https://github.com/rust-lang/crates.io-index"
checksum = "f8fdf271db1a859666b6ce10bb1bba03bf8d2bc55e13cdb1f70da75a7b8ae962"
