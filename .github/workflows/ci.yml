name: CI

on:
  # Every push: commits go straight to main and are checked there. A tag
  # push runs CI too: that run decides if a release gets images (images.yml).
  push:
  # Runs every job, e2e too, on request: Actions > CI > Run workflow.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
  # The service database is a throwaway one (db::test_url refuses any other).
  BRIM_TEST_DB: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          # Pinned by commit, the action no longer reads the toolchain from its ref name.
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # Images publish only after CI passed, so this also keeps a crate with a known advisory, or a
  # vendored crate that is not its upstream release plus the recorded patch, out of the images.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Vendored crate matches upstream plus patch
        run: scripts/check-vendor.sh
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-audit@0.22.2
      # Ignored advisories are listed in .cargo/audit.toml.
      - name: Advisories
        run: cargo audit
      # cargo audit skips the patched path copy in Cargo.lock; this checks the release it came from.
      - name: Advisories for the vendored crate
        run: cargo audit -f vendor/twilight-model.lock

  dashboard-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/dashboard/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          # Pinned by commit, the action no longer reads the toolchain from its ref name.
          toolchain: stable
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: crates/dashboard/ui
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: trunk@0.21.14
      - name: Design tokens match tokens.json
        run: node ../../../tools/design-tokens.mjs --check
      - name: Sizes come from the tokens
        run: node ../../../tools/ui-sizes.mjs
      - name: Clippy
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - name: Test
        run: cargo test --locked

  # Says if a push changed the dashboard, its web app or the browser test. A push whose range cannot
  # be read counts as changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      dashboard: ${{ steps.diff.outputs.dashboard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo dashboard=true >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -Eq '^(crates/dashboard/|tests/e2e/|\.github/workflows/ci\.yml$)'; then
            echo dashboard=true >> "$GITHUB_OUTPUT"
          else
            echo dashboard=false >> "$GITHUB_OUTPUT"
          fi

  # Slow, so it runs for a release tag, on request, and on a push that changed the dashboard, its web
  # app or the browser test. On any other push it is skipped, and a skipped job counts as passed. The
  # Images workflow builds a release only when this job passed on its tag.
  e2e:
    needs: changes
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SKIP_UNIT: "1" # the check job already runs the workspace tests
      E2E_OUT: ${{ github.workspace }}/e2e-out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          # Pinned by commit, the action no longer reads the toolchain from its ref name.
          toolchain: stable
          targets: wasm32-unknown-unknown
      # A branch or main run builds the dashboard server and the web app light: a low optimisation
      # level, no fat LTO. A release tag run keeps the profile that ships, so the run that decides if a
      # release gets images tests the shipping build. This step comes before the cache step: the cache
      # key follows these variables.
      - name: Light build profile (not for a tag)
        if: github.ref_type != 'tag'
        run: |
          echo CARGO_PROFILE_RELEASE_OPT_LEVEL=1 >> "$GITHUB_ENV"
          echo CARGO_PROFILE_RELEASE_LTO=false >> "$GITHUB_ENV"
          echo CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16 >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            .
            crates/dashboard/ui
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: trunk@0.21.14
      - uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.64.1-chromium
      - run: mkdir -p "$E2E_OUT" && npm i --no-save playwright@1.64.1 && npx playwright install --with-deps chromium
      # Both at once: the updater test needs only Docker, the sweep the Postgres service and cargo.
      # Together they took about 20 minutes one after the other, the updater test 7 of them.
      - name: Dashboard browser sweep and updater against Docker
        run: |
          { tests/e2e/updater.sh; r=$?; echo "Updater test ended after ${SECONDS}s"; exit $r; } > "$E2E_OUT/updater.log" 2>&1 & upd=$!
          sweep=0; tests/e2e/run.sh || sweep=$?
          echo "Sweep ended after ${SECONDS}s"
          updater=0; wait "$upd" || updater=$?
          echo "::group::Updater against Docker (exit $updater)"; cat "$E2E_OUT/updater.log"; echo "::endgroup::"
          echo "Browser sweep: exit $sweep. Updater against Docker: exit $updater."
          [ "$sweep" -eq 0 ] && [ "$updater" -eq 0 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-out
