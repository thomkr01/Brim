name: CI

on:
  # Every branch: a change is checked on its own branch, then main moves to that same commit.
  push:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
  # The service database is a throwaway one (db::test_url refuses any other).
  BRIM_TEST_DB: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          # Pinned by commit, the action no longer reads the toolchain from its ref name.
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # Images publish only after CI passed, so this also keeps a crate with a known advisory, or a
  # vendored crate that is not its upstream release plus the recorded patch, out of the images.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Vendored crate matches upstream plus patch
        run: scripts/check-vendor.sh
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-audit@0.22.2
      # Ignored advisories are listed in .cargo/audit.toml.
      - name: Advisories
        run: cargo audit
      # cargo audit skips the patched path copy in Cargo.lock; this checks the release it came from.
      - name: Advisories for the vendored crate
        run: cargo audit -f vendor/twilight-model.lock

  dashboard-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/dashboard/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          # Pinned by commit, the action no longer reads the toolchain from its ref name.
          toolchain: stable
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: crates/dashboard/ui
      - name: Design tokens match tokens.json
        run: node ../../../tools/design-tokens.mjs --check
      - name: Sizes come from the tokens
        run: node ../../../tools/ui-sizes.mjs
      - name: Clippy
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - name: Test
        run: cargo test --locked

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SKIP_UNIT: "1" # the check job already runs the workspace tests
      E2E_OUT: ${{ github.workspace }}/e2e-out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          # Pinned by commit, the action no longer reads the toolchain from its ref name.
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: trunk@0.21.14
      - run: mkdir -p "$E2E_OUT" && npm i --no-save playwright@1.64.1 && npx playwright install --with-deps chromium
      - name: Dashboard browser sweep
        run: tests/e2e/run.sh
      - name: Updater against Docker
        run: tests/e2e/updater.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-out
